<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OSINT Dashboard — Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #060e1f; --surface: #0b1830; --border: #1e3a5f;
      --text: #e2e8f0; --muted: #94a3b8; --accent: #3b82f6;
      --red: #ef4444; --red-bg: rgba(239,68,68,0.12);
    }
    body { background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 14px; display: flex; align-items: center; justify-content: center;
      min-height: 100vh; }
    .box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 40px 36px; width: 100%; max-width: 340px;
    }
    .brand {
      font-size: 12px; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 6px;
    }
    h1 { font-size: 18px; font-weight: 600; margin-bottom: 28px; }
    label { display: block; font-size: 12px; color: var(--muted);
            text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
    input[type="password"] {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      color: var(--text); border-radius: 6px; padding: 9px 12px;
      font-size: 14px; margin-bottom: 16px;
    }
    input[type="password"]:focus { outline: none; border-color: var(--accent); }
    button {
      width: 100%; background: var(--accent); border: none; color: #fff;
      border-radius: 6px; padding: 9px; font-size: 14px; font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #2563eb; }
    .error {
      background: var(--red-bg); border: 1px solid rgba(239,68,68,0.3);
      color: var(--red); border-radius: 6px; padding: 10px 12px;
      margin-bottom: 16px; font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="brand">&#9632; OSINT</div>
    <h1>Intelligence Dashboard</h1>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    <form method="post">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autofocus autocomplete="current-password" />
      <button type="submit">Enter</button>
    </form>
  </div>
</body>
</html>
