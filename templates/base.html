<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Luke Command Center{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- PWA -->
  <link rel="manifest" href="/static/manifest.json" />
  <meta name="theme-color" content="#060e1f" />
  <!-- iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LCC" />
  <link rel="apple-touch-icon" href="/static/icon-192.png" />
  <!-- OneSignal Web Push -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "69967aa0-ea0f-44fb-9de6-9754b62b7bb2",
          notifyButton: { enable: false }
        });
      });

      async function enableOSINTAlerts() {
        OneSignalDeferred.push(async function(OneSignal) {
          await OneSignal.Notifications.requestPermission();
          const subscribed = await OneSignal.User.PushSubscription.optedIn;
          const btn = document.getElementById("alert-btn");
          if (btn) {
            btn.textContent = subscribed ? "✅ Alerts Active" : "🔔 Enable Alerts";
            btn.style.background = subscribed ? "#22c55e" : "#ef4444";
          }
        });
      }
    </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0a0f1e;
      --nav:         #070d1a;
      --surface:     #0e1628;
      --surface-2:   #131e33;
      --border:      #1e3250;
      --border-2:    #2a4568;
      --text:        #f1f5f9;
      --muted:       #8899b4;
      --dim:         #506070;
      --accent:      #3b82f6;
      --accent-hover:#2563eb;
      --green:       #22c55e;
      --green-bg:    rgba(34,197,94,0.1);
      --amber:       #f59e0b;
      --amber-bg:    rgba(245,158,11,0.1);
      --red:         #ef4444;
      --red-bg:      rgba(239,68,68,0.1);
      --radius:      8px;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased; }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Nav ── */
    nav {
      background: var(--nav);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
    }
    .nav-inner {
      max-width: 1200px; margin: 0 auto;
      padding: 0 20px; height: 50px;
      display: flex; align-items: center; gap: 24px;
    }
    .nav-brand {
      font-size: 13px; font-weight: 700; letter-spacing: 0.04em;
      text-transform: uppercase; color: var(--text);
      white-space: nowrap; text-decoration: none;
    }
    .nav-brand:hover { text-decoration: none; color: var(--text); }
    .nav-links {
      display: flex; gap: 2px;
      overflow-x: auto; -webkit-overflow-scrolling: touch; flex-shrink: 1; min-width: 0;
    }
    .nav-links::-webkit-scrollbar { display: none; }
    .nav-links a {
      color: var(--muted); font-size: 13px; font-weight: 500;
      padding: 5px 10px; border-radius: var(--radius);
      transition: color 0.12s, background 0.12s; white-space: nowrap;
    }
    .nav-links a:hover { color: var(--text); background: var(--surface-2); text-decoration: none; }
    .nav-links a.active { color: var(--text); background: var(--surface-2); font-weight: 600; text-decoration: none; }
    .nav-logout {
      color: var(--dim); font-size: 12px; padding: 5px 8px;
      border-radius: var(--radius); transition: color 0.15s;
    }
    .nav-logout:hover { color: var(--red); text-decoration: none; }

    /* ── Page wrapper ── */
    .page { max-width: 1200px; margin: 0 auto; padding: 32px 20px; }
    .page-header { margin-bottom: 28px; }
    .page-header h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
    .page-header p { color: var(--muted); margin-top: 5px; font-size: 13px; }

    /* ── Badges ── */
    .badge {
      display: inline-block; font-size: 11px; font-weight: 700;
      letter-spacing: 0.05em; padding: 2px 8px; border-radius: 100px;
      text-transform: uppercase; white-space: nowrap;
    }
    .badge-green  { background: var(--green-bg); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
    .badge-amber  { background: var(--amber-bg); color: var(--amber); border: 1px solid rgba(245,158,11,0.3); }
    .badge-red    { background: var(--red-bg);   color: var(--red);   border: 1px solid rgba(239,68,68,0.3); }
    .badge-gray   { background: var(--surface-2); color: var(--dim);  border: 1px solid var(--border); }
    .badge-blue   { background: rgba(59,130,246,0.12); color: var(--accent); border: 1px solid rgba(59,130,246,0.3); }

    /* ── Table ── */
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
    table { width: 100%; border-collapse: collapse; }
    thead { background: var(--surface); }
    th { padding: 11px 14px; text-align: left; font-size: 11px; font-weight: 600;
         letter-spacing: 0.05em; text-transform: uppercase; color: var(--dim);
         border-bottom: 1px solid var(--border); white-space: nowrap; }
    td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface-2); }
    .row-green td { background: rgba(34,197,94,0.05); }
    .row-amber td { background: rgba(245,158,11,0.05); }
    .row-red   td { background: rgba(239,68,68,0.05); }

    /* ── Cards ── */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px;
    }

    /* ── Filters ── */
    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; align-items: center; }
    .filters select, .filters input {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); border-radius: var(--radius);
      padding: 6px 10px; font-size: 13px;
    }
    .filters select:focus, .filters input:focus { outline: none; border-color: var(--accent); }
    .filters select option { background: var(--surface); }
    .btn {
      padding: 6px 14px; border-radius: var(--radius); font-size: 13px;
      cursor: pointer; border: 1px solid var(--border); background: var(--surface);
      color: var(--text); transition: background 0.15s, border-color 0.15s;
    }
    .btn:hover { background: var(--surface-2); border-color: var(--border-2); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
    .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .btn-sm { padding: 3px 10px; font-size: 12px; }

    /* ── Error ── */
    .alert-error {
      background: var(--red-bg); border: 1px solid rgba(239,68,68,0.3);
      color: var(--red); border-radius: var(--radius); padding: 12px 16px;
      margin-bottom: 20px;
    }

    /* ── Util ── */
    .text-muted { color: var(--muted); }
    .text-dim   { color: var(--dim); }
    .mt-4  { margin-top: 16px; }
    .mt-6  { margin-top: 24px; }
    .empty { color: var(--muted); padding: 40px; text-align: center; }

    @media (max-width: 640px) {
      .nav-inner { gap: 8px; }
      .nav-links a { padding: 4px 7px; font-size: 12px; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="nav-brand" href="{{ url_for('home') }}">&#9632; LCC</a>
    <div class="nav-links">
      <a href="{{ url_for('home') }}" {% if request.endpoint == 'home' %}class="active"{% endif %}>Home</a>
      <a href="{{ url_for('osint_briefs') }}" {% if request.endpoint in ('osint_briefs', 'brief') %}class="active"{% endif %}>OSINT</a>
      <a href="{{ url_for('weekly') }}" {% if request.endpoint in ('weekly', 'weekly_detail') %}class="active"{% endif %}>Weekly</a>
      <a href="{{ url_for('search') }}" {% if request.endpoint == 'search' %}class="active"{% endif %}>Search</a>
      <a href="{{ url_for('timeline') }}" {% if request.endpoint == 'timeline' %}class="active"{% endif %}>Timeline</a>
      <a href="{{ url_for('chat') }}" {% if request.endpoint == 'chat' %}class="active"{% endif %}>Chat</a>
      <a href="{{ url_for('projects') }}" {% if request.endpoint == 'projects' %}class="active"{% endif %}>Projects</a>
      <a href="{{ url_for('rotc') }}" {% if request.endpoint == 'rotc' %}class="active"{% endif %}>ROTC</a>
      <a href="{{ url_for('school') }}" {% if request.endpoint == 'school' %}class="active"{% endif %}>School</a>
      <a href="{{ url_for('notes') }}" {% if request.endpoint == 'notes' %}class="active"{% endif %}>Notes</a>
    </div>
    <a class="nav-logout" href="{{ url_for('logout') }}">Logout</a>
  </div>
</nav>

<div class="page">
  {% block content %}{% endblock %}
</div>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/sw.js');
  });
}
</script>

<!-- Vercel Web Analytics -->
<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</body>
</html>
