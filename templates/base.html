<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}OSINT Dashboard{% endblock %}</title>

  <!-- PWA -->
  <link rel="manifest" href="/static/manifest.json" />
  <meta name="theme-color" content="#060e1f" />
  <!-- iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="OSINT" />
  <link rel="apple-touch-icon" href="/static/icon-192.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #060e1f;
      --nav:         #040a16;
      --surface:     #0b1830;
      --surface-2:   #0f2040;
      --border:      #1e3a5f;
      --border-2:    #2a4f7a;
      --text:        #e2e8f0;
      --muted:       #94a3b8;
      --dim:         #64748b;
      --accent:      #3b82f6;
      --green:       #22c55e;
      --green-bg:    rgba(34,197,94,0.12);
      --amber:       #f59e0b;
      --amber-bg:    rgba(245,158,11,0.12);
      --red:         #ef4444;
      --red-bg:      rgba(239,68,68,0.12);
      --radius:      6px;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 14px; line-height: 1.6; }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Nav ── */
    nav {
      background: var(--nav);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
    }
    .nav-inner {
      max-width: 1200px; margin: 0 auto;
      padding: 0 20px; height: 50px;
      display: flex; align-items: center; gap: 24px;
    }
    .nav-brand {
      font-size: 13px; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--accent);
      white-space: nowrap; text-decoration: none;
    }
    .nav-brand:hover { text-decoration: none; color: var(--accent); }
    .nav-links { display: flex; gap: 4px; }
    .nav-links a {
      color: var(--muted); font-size: 13px; padding: 5px 10px;
      border-radius: var(--radius); transition: color 0.15s, background 0.15s;
    }
    .nav-links a:hover, .nav-links a.active {
      color: var(--text); background: var(--surface-2); text-decoration: none;
    }
    .nav-search {
      flex: 1; max-width: 320px; margin-left: auto;
      display: flex; gap: 6px;
    }
    .nav-search input {
      flex: 1; background: var(--surface); border: 1px solid var(--border);
      color: var(--text); border-radius: var(--radius);
      padding: 5px 10px; font-size: 13px;
    }
    .nav-search input:focus { outline: none; border-color: var(--accent); }
    .nav-search input::placeholder { color: var(--dim); }
    .nav-search button {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--muted); padding: 5px 10px; border-radius: var(--radius);
      cursor: pointer; font-size: 13px;
    }
    .nav-search button:hover { border-color: var(--border-2); color: var(--text); }
    .nav-logout {
      color: var(--dim); font-size: 12px; padding: 5px 8px;
      border-radius: var(--radius); transition: color 0.15s;
    }
    .nav-logout:hover { color: var(--red); text-decoration: none; }

    /* ── Page wrapper ── */
    .page { max-width: 1200px; margin: 0 auto; padding: 28px 20px; }
    .page-header { margin-bottom: 24px; }
    .page-header h1 { font-size: 20px; font-weight: 600; }
    .page-header p { color: var(--muted); margin-top: 4px; font-size: 13px; }

    /* ── Badges ── */
    .badge {
      display: inline-block; font-size: 11px; font-weight: 700;
      letter-spacing: 0.05em; padding: 2px 8px; border-radius: 100px;
      text-transform: uppercase; white-space: nowrap;
    }
    .badge-green  { background: var(--green-bg); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
    .badge-amber  { background: var(--amber-bg); color: var(--amber); border: 1px solid rgba(245,158,11,0.3); }
    .badge-red    { background: var(--red-bg);   color: var(--red);   border: 1px solid rgba(239,68,68,0.3); }
    .badge-gray   { background: var(--surface-2); color: var(--dim);  border: 1px solid var(--border); }
    .badge-blue   { background: rgba(59,130,246,0.12); color: var(--accent); border: 1px solid rgba(59,130,246,0.3); }

    /* ── Table ── */
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
    table { width: 100%; border-collapse: collapse; }
    thead { background: var(--surface); }
    th { padding: 10px 14px; text-align: left; font-size: 11px; font-weight: 600;
         letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim);
         border-bottom: 1px solid var(--border); white-space: nowrap; }
    td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface-2); }
    .row-green td { background: rgba(34,197,94,0.05); }
    .row-amber td { background: rgba(245,158,11,0.05); }
    .row-red   td { background: rgba(239,68,68,0.05); }

    /* ── Cards ── */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px;
    }

    /* ── Filters ── */
    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; align-items: center; }
    .filters select, .filters input {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); border-radius: var(--radius);
      padding: 6px 10px; font-size: 13px;
    }
    .filters select:focus, .filters input:focus { outline: none; border-color: var(--accent); }
    .filters select option { background: var(--surface); }
    .btn {
      padding: 6px 14px; border-radius: var(--radius); font-size: 13px;
      cursor: pointer; border: 1px solid var(--border); background: var(--surface);
      color: var(--text); transition: background 0.15s, border-color 0.15s;
    }
    .btn:hover { background: var(--surface-2); border-color: var(--border-2); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover { background: #2563eb; border-color: #2563eb; }
    .btn-sm { padding: 3px 10px; font-size: 12px; }

    /* ── Error ── */
    .alert-error {
      background: var(--red-bg); border: 1px solid rgba(239,68,68,0.3);
      color: var(--red); border-radius: var(--radius); padding: 12px 16px;
      margin-bottom: 20px;
    }

    /* ── Util ── */
    .text-muted { color: var(--muted); }
    .text-dim   { color: var(--dim); }
    .mt-4  { margin-top: 16px; }
    .mt-6  { margin-top: 24px; }
    .empty { color: var(--muted); padding: 40px; text-align: center; }

    @media (max-width: 640px) {
      .nav-inner { gap: 12px; }
      .nav-links a { padding: 5px 7px; }
      .nav-search { max-width: 180px; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="nav-brand" href="{{ url_for('index') }}">&#9632; OSINT</a>
    <div class="nav-links">
      <a href="{{ url_for('index') }}" {% if request.endpoint == 'index' %}class="active"{% endif %}>Briefs</a>
      <a href="{{ url_for('scorecard') }}" {% if request.endpoint == 'scorecard' %}class="active"{% endif %}>Scorecard</a>
      <a href="{{ url_for('claims') }}" {% if request.endpoint == 'claims' %}class="active"{% endif %}>Claims</a>
      <a href="{{ url_for('weekly') }}" {% if request.endpoint in ('weekly', 'weekly_detail') %}class="active"{% endif %}>Weekly</a>
      <a href="{{ url_for('timeline') }}" {% if request.endpoint == 'timeline' %}class="active"{% endif %}>Timeline</a>
      <a href="{{ url_for('flagged') }}" {% if request.endpoint == 'flagged' %}class="active"{% endif %}>Flagged</a>
      <a href="{{ url_for('chat') }}" {% if request.endpoint == 'chat' %}class="active"{% endif %}>Chat</a>
    </div>
    <form class="nav-search" action="{{ url_for('search') }}" method="get">
      <input type="search" name="q" placeholder="Search briefs…" value="{{ request.args.get('q', '') }}">
      <button type="submit">Go</button>
    </form>
    <a class="nav-logout" href="{{ url_for('logout') }}">Logout</a>
  </div>
</nav>

<div class="page">
  {% block content %}{% endblock %}
</div>


<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/sw.js');
  });
}
</script>
</body>
</html>
