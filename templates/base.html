<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}OSINT Dashboard{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- PWA -->
  <link rel="manifest" href="/static/manifest.json" />
  <meta name="theme-color" content="#060e1f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="OSINT" />
  <link rel="apple-touch-icon" href="/static/icon-192.png" />
  <!-- OneSignal Web Push -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "69967aa0-ea0f-44fb-9de6-9754b62b7bb2",
        notifyButton: { enable: false }
      });
    });
    async function enableOSINTAlerts() {
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.Notifications.requestPermission();
        const subscribed = await OneSignal.User.PushSubscription.optedIn;
        const btn = document.getElementById("alert-btn");
        if (btn) {
          btn.textContent = subscribed ? "Alerts Active" : "Enable Alerts";
          btn.style.background = subscribed ? "#22c55e" : "#ef4444";
        }
      });
    }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #060e1f;
      --nav:         #030912;
      --surface:     #0b1830;
      --surface-2:   #0f2040;
      --border:      #1a3352;
      --border-2:    #2a5080;
      --text:        #e2e8f0;
      --muted:       #8ba3bf;
      --dim:         #4a6480;
      --accent:      #38bdf8;
      --accent-glow: rgba(56,189,248,0.15);
      --green:       #22c55e;
      --green-bg:    rgba(34,197,94,0.12);
      --amber:       #f59e0b;
      --amber-bg:    rgba(245,158,11,0.12);
      --red:         #ef4444;
      --red-bg:      rgba(239,68,68,0.12);
      --radius:      6px;
      --mono:        'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
    }

    html, body {
      height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 14px; line-height: 1.6;
    }

    body::after {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: 9998;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(0,0,0,0.04) 3px,
        rgba(0,0,0,0.04) 4px
      );
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .mono { font-family: var(--mono); }

    /* Nav */
    nav {
      background: var(--nav);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
    }
    .nav-inner {
      max-width: 1200px; margin: 0 auto;
      padding: 0 20px; height: 50px;
      display: flex; align-items: center; gap: 20px;
    }
    .nav-brand {
      font-family: var(--mono); font-size: 12px; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent);
      white-space: nowrap; text-decoration: none;
      text-shadow: 0 0 14px rgba(56,189,248,0.6);
    }
    .nav-brand:hover { text-decoration: none; color: var(--accent); }
    .nav-links { display: flex; gap: 2px; }
    .nav-links a {
      color: var(--muted); font-size: 12px; font-family: var(--mono);
      padding: 5px 10px; border-radius: var(--radius);
      transition: color 0.15s, background 0.15s;
      letter-spacing: 0.02em; border: 1px solid transparent;
    }
    .nav-links a:hover { color: var(--text); background: var(--surface-2); text-decoration: none; }
    .nav-links a.active {
      color: var(--accent); background: var(--accent-glow);
      border-color: rgba(56,189,248,0.25); text-decoration: none;
    }
    .nav-fetched {
      font-family: var(--mono); font-size: 10px; color: var(--dim);
      white-space: nowrap; letter-spacing: 0.05em;
    }
    .nav-search {
      flex: 1; max-width: 280px; margin-left: auto;
      display: flex; gap: 6px;
    }
    .nav-search input {
      flex: 1; background: var(--surface); border: 1px solid var(--border);
      color: var(--text); border-radius: var(--radius);
      padding: 5px 10px; font-size: 13px;
    }
    .nav-search input:focus { outline: none; border-color: var(--accent); }
    .nav-search input::placeholder { color: var(--dim); }
    .nav-search button {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--muted); padding: 5px 10px; border-radius: var(--radius);
      cursor: pointer; font-size: 13px;
    }
    .nav-search button:hover { border-color: var(--border-2); color: var(--text); }
    .nav-logout {
      color: var(--dim); font-size: 11px; font-family: var(--mono);
      padding: 5px 8px; border-radius: var(--radius); transition: color 0.15s;
    }
    .nav-logout:hover { color: var(--red); text-decoration: none; }

    /* Mobile bottom tab bar */
    .mobile-tabs {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--nav); border-top: 1px solid var(--border);
      z-index: 200;
      padding: 6px 0;
      padding-bottom: max(6px, env(safe-area-inset-bottom));
    }
    .mobile-tabs-inner { display: flex; justify-content: space-around; }
    .mobile-tab {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      color: var(--dim); font-size: 10px; font-family: var(--mono);
      padding: 4px 10px; border-radius: var(--radius);
      text-decoration: none; transition: color 0.15s;
    }
    .mobile-tab svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .mobile-tab:hover, .mobile-tab.active { color: var(--accent); text-decoration: none; }

    /* Page */
    .page { max-width: 1200px; margin: 0 auto; padding: 28px 20px; }
    .page-header { margin-bottom: 24px; }
    .page-header h1 {
      font-size: 18px; font-weight: 700;
      font-family: var(--mono); letter-spacing: 0.03em;
    }
    .page-header p { color: var(--muted); margin-top: 4px; font-size: 13px; }

    /* Badges */
    .badge {
      display: inline-block; font-size: 10px; font-weight: 700;
      font-family: var(--mono); letter-spacing: 0.05em;
      padding: 2px 8px; border-radius: 100px;
      text-transform: uppercase; white-space: nowrap;
    }
    .badge-green  { background: var(--green-bg); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
    .badge-amber  { background: var(--amber-bg); color: var(--amber); border: 1px solid rgba(245,158,11,0.3); }
    .badge-red    { background: var(--red-bg);   color: var(--red);   border: 1px solid rgba(239,68,68,0.3); }
    .badge-gray   { background: var(--surface-2); color: var(--dim);  border: 1px solid var(--border); }
    .badge-blue   { background: rgba(56,189,248,0.12); color: var(--accent); border: 1px solid rgba(56,189,248,0.3); }

    /* Table */
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
    table { width: 100%; border-collapse: collapse; }
    thead { background: var(--surface); }
    th {
      padding: 10px 14px; text-align: left; font-size: 10px; font-weight: 700;
      font-family: var(--mono); letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--dim); border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface-2); }
    .row-green td { background: rgba(34,197,94,0.04); }
    .row-amber td { background: rgba(245,158,11,0.04); }
    .row-red   td { background: rgba(239,68,68,0.04); }

    /* Cards */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px;
    }

    /* Filters */
    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; align-items: center; }
    .filters select, .filters input {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); border-radius: var(--radius);
      padding: 6px 10px; font-size: 13px;
    }
    .filters select:focus, .filters input:focus { outline: none; border-color: var(--accent); }
    .filters select option { background: var(--surface); }
    .btn {
      padding: 6px 14px; border-radius: var(--radius); font-size: 13px;
      cursor: pointer; border: 1px solid var(--border); background: var(--surface);
      color: var(--text); transition: background 0.15s, border-color 0.15s;
    }
    .btn:hover { background: var(--surface-2); border-color: var(--border-2); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 700; }
    .btn-primary:hover { background: #7dd3fc; border-color: #7dd3fc; }
    .btn-sm { padding: 3px 10px; font-size: 12px; }

    /* Error */
    .alert-error {
      background: var(--red-bg); border: 1px solid rgba(239,68,68,0.3);
      color: var(--red); border-radius: var(--radius); padding: 12px 16px;
      margin-bottom: 20px;
    }

    /* Util */
    .text-muted  { color: var(--muted); }
    .text-dim    { color: var(--dim); }
    .text-green  { color: var(--green); }
    .text-amber  { color: var(--amber); }
    .text-red    { color: var(--red); }
    .text-accent { color: var(--accent); }
    .mt-4  { margin-top: 16px; }
    .mt-6  { margin-top: 24px; }
    .empty { color: var(--muted); padding: 40px; text-align: center; }

    @media (max-width: 640px) {
      .nav-links, .nav-fetched { display: none; }
      .nav-search { max-width: 200px; }
      .mobile-tabs { display: block; }
      .page { padding-bottom: 80px; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="nav-brand" href="{{ url_for('index') }}">&#9656; OSINT</a>
    <div class="nav-links">
      <a href="{{ url_for('index') }}" {% if request.endpoint == 'index' %}class="active"{% endif %}>briefs</a>
      <a href="{{ url_for('scorecard') }}" {% if request.endpoint == 'scorecard' %}class="active"{% endif %}>scorecard</a>
      <a href="{{ url_for('weekly') }}" {% if request.endpoint in ('weekly', 'weekly_detail') %}class="active"{% endif %}>weekly</a>
      <a href="{{ url_for('timeline') }}" {% if request.endpoint == 'timeline' %}class="active"{% endif %}>timeline</a>
      <a href="{{ url_for('chat') }}" {% if request.endpoint == 'chat' %}class="active"{% endif %}>chat</a>
    </div>
    {% if fetched_at %}
    <span class="nav-fetched">fetched {{ fetched_at }}</span>
    {% endif %}
    <form class="nav-search" action="{{ url_for('search') }}" method="get">
      <input type="search" name="q" id="nav-search-input" placeholder="search..." value="{{ request.args.get('q', '') }}">
      <button type="submit">Go</button>
    </form>
    <a class="nav-logout" href="{{ url_for('logout') }}">logout</a>
  </div>
</nav>

<nav class="mobile-tabs">
  <div class="mobile-tabs-inner">
    <a href="{{ url_for('index') }}" class="mobile-tab {% if request.endpoint == 'index' %}active{% endif %}">
      <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="15" y2="18"/></svg>
      briefs
    </a>
    <a href="{{ url_for('scorecard') }}" class="mobile-tab {% if request.endpoint == 'scorecard' %}active{% endif %}">
      <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      score
    </a>
    <a href="{{ url_for('weekly') }}" class="mobile-tab {% if request.endpoint in ('weekly', 'weekly_detail') %}active{% endif %}">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      weekly
    </a>
    <a href="{{ url_for('timeline') }}" class="mobile-tab {% if request.endpoint == 'timeline' %}active{% endif %}">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      timeline
    </a>
    <a href="{{ url_for('chat') }}" class="mobile-tab {% if request.endpoint == 'chat' %}active{% endif %}">
      <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      chat
    </a>
  </div>
</nav>

<div class="page">
  {% block content %}{% endblock %}
</div>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/sw.js');
  });
}

document.addEventListener('keydown', function(e) {
  const tag = (document.activeElement.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

  if (e.key === '/') {
    e.preventDefault();
    const inp = document.getElementById('nav-search-input');
    if (inp) inp.focus();
    return;
  }

  const rows = Array.from(document.querySelectorAll('.brief-row[data-href]'));
  if (!rows.length) return;

  let cur = rows.findIndex(r => r.classList.contains('kb-focus'));

  if (e.key === 'j') {
    e.preventDefault();
    if (cur >= 0) rows[cur].classList.remove('kb-focus');
    cur = cur < 0 ? 0 : Math.min(cur + 1, rows.length - 1);
    rows[cur].classList.add('kb-focus');
    rows[cur].scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'k') {
    e.preventDefault();
    if (cur >= 0) rows[cur].classList.remove('kb-focus');
    cur = cur < 0 ? 0 : Math.max(cur - 1, 0);
    rows[cur].classList.add('kb-focus');
    rows[cur].scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter' && cur >= 0) {
    window.location.href = rows[cur].dataset.href;
  }
});
</script>

</body>
</html>
